<!DOCTYPE html>
<html>
<head>
<title>Student Dashboard + Product Store</title>

<style>

body{
font-family: Arial;
text-align:center;
background: linear-gradient(135deg,#74ebd5,#9face6);
padding:20px;
}

h2{
color:#333;
margin-top:40px;
}

button{
margin:5px;
padding:10px 15px;
cursor:pointer;
border:none;
border-radius:6px;
background-color:#4CAF50;
color:white;
font-weight:bold;
transition:0.3s;
}

button:hover{
background-color:#2e8b57;
}

.fail{
background-color:#e74c3c;
}

.fail:hover{
background-color:#c0392b;
}

input{
padding:10px;
width:300px;
border-radius:6px;
border:1px solid gray;
margin:15px;
font-size:15px;
}

table{
margin:20px auto;
border-collapse: collapse;
width:70%;
background:white;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

th, td{
border:1px solid #ddd;
padding:12px;
text-align:center;
}

th{
background-color:#4CAF50;
color:white;
}

tr:nth-child(even){
background-color:#f2f2f2;
}

tr:hover{
background-color:#ddd;
}

ul{
list-style:none;
padding:0;
}

</style>

</head>

<body>

<h2>Student Result Dashboard</h2>

<input 
type="text"
id="searchBox"
placeholder="Search by name, age, or marks..."
onkeyup="searchStudents()"
>

<br>

<button onclick="showAll()">All Students</button>
<button onclick="above50()">Marks > 50</button>
<button onclick="above60()">Marks > 60</button>
<button onclick="above70()">Marks > 70</button>
<button onclick="above80()">Marks > 80</button>
<button onclick="above90()">Marks > 90</button>
<button onclick="showTopper()">Topper</button>
<button class="fail" onclick="failedStudents()">Failed Students</button>

<table>

<thead>
<tr>
<th>Name</th>
<th>Age</th>
<th>Marks</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>


<h2>Product Store</h2>

<input
type="text"
id="productSearch"
placeholder="Search product..."
onkeyup="searchProducts()"
>

<br>

<button onclick="showProducts()">All Products</button>
<button onclick="rating4()">Rating > 4</button>
<button onclick="rating45()">Rating > 4.5</button>
<button onclick="price500()">Price < 500</button>
<button onclick="price1000()">Price < 1000</button>

<table>

<thead>
<tr>
<th>Product</th>
<th>Price</th>
<th>Rating</th>
<th>Action</th>
</tr>
</thead>

<tbody id="productTable"></tbody>

</table>

<h3>Cart Items</h3>

<ul id="cartList"></ul>


<script>



let students = [
{name:"Rahul", age:20, marks:95},
{name:"Anita", age:21, marks:82},
{name:"Shyam", age:19, marks:67},
{name:"Ravi", age:22, marks:45},
{name:"Priya", age:20, marks:91},
{name:"Amit", age:21, marks:55},
{name:"Neha", age:20, marks:73}
];

function display(list){

let table="";

list.forEach(function(student){

table+=`
<tr>
<td>${student.name}</td>
<td>${student.age}</td>
<td>${student.marks}</td>
</tr>
`;

});

document.getElementById("tableBody").innerHTML=table;

}

function showAll(){
display(students);
}

function above50(){
display(students.filter(s=>s.marks>50));
}

function above60(){
display(students.filter(s=>s.marks>60));
}

function above70(){
display(students.filter(s=>s.marks>70));
}

function above80(){
display(students.filter(s=>s.marks>80));
}

function above90(){
display(students.filter(s=>s.marks>90));
}

function failedStudents(){
display(students.filter(s=>s.marks<50));
}

function showTopper(){

let topper=students[0];

students.forEach(function(s){

if(s.marks>topper.marks){
topper=s;
}

});

display([topper]);

}

function searchStudents(){

let input=document.getElementById("searchBox").value.toLowerCase();

let result=students.filter(function(s){

return(
s.name.toLowerCase().includes(input) ||
s.age.toString().includes(input) ||
s.marks.toString().includes(input)
);

});

display(result);

}

showAll();




let products=[
{name:"Wireless Mouse", price:400, rating:4.2},
{name:"Keyboard", price:700, rating:4.6},
{name:"Headphones", price:1200, rating:4.7},
{name:"USB Cable", price:150, rating:4.1},
{name:"Laptop Stand", price:900, rating:4.5},
{name:"Bluetooth Speaker", price:2000, rating:4.8}
];

let cart=[];

function displayProducts(list){

let table="";

list.forEach(function(p){

table+=`
<tr>
<td>${p.name}</td>
<td>${p.price}</td>
<td>${p.rating}</td>
<td>
<button onclick="addToCart('${p.name}')">Add to Cart</button>
</td>
</tr>
`;

});

document.getElementById("productTable").innerHTML=table;

}

function showProducts(){
displayProducts(products);
}

function rating4(){
displayProducts(products.filter(p=>p.rating>4));
}

function rating45(){
displayProducts(products.filter(p=>p.rating>4.5));
}

function price500(){
displayProducts(products.filter(p=>p.price<500));
}

function price1000(){
displayProducts(products.filter(p=>p.price<1000));
}

function searchProducts(){

let input=document.getElementById("productSearch").value.toLowerCase();

let result=products.filter(function(p){

return(
p.name.toLowerCase().includes(input) ||
p.price.toString().includes(input) ||
p.rating.toString().includes(input)
);

});

displayProducts(result);

}

function addToCart(product){

cart.push(product);

let list="";

cart.forEach(function(item){
list+=`<li>${item}</li>`;
});

document.getElementById("cartList").innerHTML=list;

}

showProducts();

</script>

</body>
</html>
