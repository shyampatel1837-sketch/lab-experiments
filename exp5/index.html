<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combined Calculator</title>

<style>
body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg,#1779db,#16be6a);
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ===== SIMPLE CALCULATOR  ===== */

.calc2-container{
  margin-top:40px;
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 10px 20px rgba(0,0,0,0.2);
  text-align:center;
  width:300px;
}

.calc2-container input{
  font-size:16px;
  padding:8px;
  margin:5px;
  width:80%;
}

.calc2-container button{
  padding:8px 15px;
  margin:5px;
  font-size:16px;
  cursor:pointer;
}

</style>
</head>

<body>

<!-- ================= SIMPLE CALCULATOR (TOP) ================= -->

<div class="calc2-container">
  <h2>Simple Calculator</h2>

  <input type="number" id="a1" placeholder="Enter first number">
  <br>
  <input type="number" id="a2" placeholder="Enter second number">
  <br><br>

  <button onclick="calculateSimple('+')">+</button>
  <button onclick="calculateSimple('-')">-</button>
  <button onclick="calculateSimple('*')">*</button>
  <button onclick="calculateSimple('/')">/</button>

  <h3>Result: <span id="res"></span></h3>
</div>

<script>

/* ===== SIMPLE CALCULATOR SCRIPT ===== */

function calculateSimple(operation){

  let a = parseFloat(document.getElementById("a1").value);
  let b = parseFloat(document.getElementById("a2").value);
  let res;

  if (operation === '+') {
    res = a + b;
  }
  else if (operation === '-') {
    res = a - b;
  }
  else if (operation === '*') {
    res = a * b;
  }
  else if (operation === '/') {
    if (b === 0) {
      res = "Cannot divide by zero";
    } else {
      res = a / b;
    }
  }

  document.getElementById("res").textContent = res;
}

</script>

</body>
</html>
