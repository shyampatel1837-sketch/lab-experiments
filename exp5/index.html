<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combined Calculator</title>

<style>
body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg,#1779db,#16be6a);
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ===== SIMPLE CALCULATOR  ===== */

.calc2-container{
  margin-top:40px;
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 10px 20px rgba(0,0,0,0.2);
  text-align:center;
  width:300px;
}

.calc2-container input{
  font-size:16px;
  padding:8px;
  margin:5px;
  width:80%;
}

.calc2-container button{
  padding:8px 15px;
  margin:5px;
  font-size:16px;
  cursor:pointer;
}

/* ===== STYLED CALCULATOR ===== */

.calc1-container{
  margin-top:60px;
  background: white;
  padding: 30px;
  box-shadow:0 15px 30px rgba(0,0,0,0.3);
  border-radius: 25px;
  width:max-content;
}

#display{
  width:100%;
  height:60px;
  border:none;
  outline:none;
  border-radius:12px;
  margin-bottom:20px;
  font-size:28px;
  text-align:right;
  padding-right:15px;
  background:#1f2730;
  color:white;
  box-shadow:inset 5px 5px 10px rgba(0,0,0,0.6),
  inset -5px -5px 10px rgba(255,255,255,0.05);
}

.calc1-buttons{
  display:grid;
  padding:20px;
  grid-template-columns:repeat(4,70px);
  gap:15px;
}

.calc1-buttons button{
  height:60px;
  border:none;
  border-radius:15px;
  font-size:18px;
  cursor:pointer;
  color:white;
  background:#293a49;
  box-shadow:6px 6px 12px rgba(0,0,0,0.6),
  -6px -6px 12px rgba(255,255,255,0.05);
}

.calc1-buttons button:active{
  box-shadow:inset 4px 4px 8px rgba(0,0,0,0.6),
  inset -4px -4px 8px rgba(255,255,255,0.05);
}

</style>
</head>

<body>

<!-- ================= SIMPLE CALCULATOR (TOP) ================= -->

<div class="calc2-container">
  <h2>Simple Calculator</h2>

  <input type="number" id="a1" placeholder="Enter first number">
  <br>
  <input type="number" id="a2" placeholder="Enter second number">
  <br><br>

  <button onclick="calculateSimple('+')">+</button>
  <button onclick="calculateSimple('-')">-</button>
  <button onclick="calculateSimple('*')">*</button>
  <button onclick="calculateSimple('/')">/</button>

  <h3>Result: <span id="res"></span></h3>
</div>


<!-- ================= STYLED CALCULATOR (BOTTOM) ================= -->

<div class="calc1-container">
  <input type="text" id="display" value="0" readonly>

  <div class="calc1-buttons">
    <button onclick="clearDisplay()">AC</button>
    <button onclick="deleteLast()">DL</button>
    <button onclick="append('%')">%</button>
    <button onclick="append('/')">/</button>

    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button onclick="append('*')">*</button>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button onclick="append('-')">-</button>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button onclick="append('+')">+</button>

    <button onclick="append('0')">0</button>
    <button onclick="append('00')">00</button>
    <button onclick="append('.')">.</button>
    <button onclick="calculateDisplay()">=</button>
  </div>
</div>


<script>

/* ===== SIMPLE CALCULATOR SCRIPT ===== */

function calculateSimple(operation){

  let a = parseFloat(document.getElementById("a1").value);
  let b = parseFloat(document.getElementById("a2").value);
  let res;

  if (operation === '+') {
    res = a + b;
  }
  else if (operation === '-') {
    res = a - b;
  }
  else if (operation === '*') {
    res = a * b;
  }
  else if (operation === '/') {
    if (b === 0) {
      res = "Cannot divide by zero";
    } else {
      res = a / b;
    }
  }

  document.getElementById("res").textContent = res;
}


/* ===== STYLED CALCULATOR SCRIPT ===== */

let display = document.getElementById("display")

function append(value){
  if(display.value === "0"){
    display.value = value
  } else {
    display.value += value
  }
}

function clearDisplay(){
  display.value = "0"
}

function deleteLast(){
  display.value = display.value.slice(0,-1)
  if(display.value === ""){
    display.value = "0"
  }
}

function calculateDisplay(){
  try{
    display.value = eval(display.value)
  }
  catch{
    display.value = "Error"
  }
}

</script>

</body>
</html>
