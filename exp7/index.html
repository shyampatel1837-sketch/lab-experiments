<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #10d6b2, #253b9b);
}

.container {
    width: 420px;
    padding: 30px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.288);
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    color: #000;
}

.container h2 {
    text-align: center;
    margin-bottom: 20px;
    font-weight: bold;
}
.form-group {
    margin-bottom: 15px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
}

input[type="text"],
input[type="email"],
input[type="password"],
input[type="tel"],
input[type="date"] {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.6);
    transition: 0.3s;
}

input:focus {
    background: #fff;
    box-shadow: 0 0 5px rgba(26, 1, 1, 0.3);
}

.slider-container {
    display: flex;
    align-items: center;
    gap: 10px;
}

input[type="range"] {
    flex: 1;
    appearance: none;
    height: 6px;
    border-radius: 10px;
    background: #333;
    outline: none;
}

input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    width: 18px;
    height: 18px;
    background: orange;
    border-radius: 50%;
    cursor: pointer;
}

.gender {
    display: flex;
    gap: 15px;
}


button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(to right, rgb(216, 119, 119), #e75757);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

.container {
    animation: fadeIn 0.8s ease-in-out;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="container">
    <h2>Registration Form</h2>

    <form id="form">

        <div class="form-group">
            <label>Full Name *</label>
            <input type="text" required>
        </div>

        <div class="form-group">
            <label>Age *</label>
            <div class="slider-container">
                <input type="range" id="age" min="10" max="60" value="18">
                <span id="ageValue">18</span>
            </div>
        </div>

        <div class="form-group">
            <label>Email *</label>
            <input type="email" required>
        </div>

        <div class="form-group">
            <label>Password *</label>
            <input type="password" required>
        </div>

        <div class="form-group">
            <label>Telephone *</label>
            <input type="tel" required>
        </div>

        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date">
        </div>

        <div class="form-group">
            <label>Gender *</label>
            <div class="gender">
                <label><input type="radio" name="gender"> Male</label>
                <label><input type="radio" name="gender"> Female</label>
            </div>
        </div>

        <button type="submit">Submit</button>
    </form>
</div>

<script>
const ageSlider = document.getElementById("age");
const ageValue = document.getElementById("ageValue");

ageSlider.oninput = () => {
    ageValue.textContent = ageSlider.value;
};

document.getElementById("form").addEventListener("submit", function(e) {
    e.preventDefault();

    alert("Form Submitted Successfully!");
});
</script>

</body>
</html>
