<!DOCTYPE html>
<html lang="en">
 <head>
   <meta charset="UTF-8">
   <meta name = "viewport" content="width=device-width, initial-scale=1.0">
   <tile>STYLED CALCULATOR </tile>
  
<style>
/* ===== STYLED CALCULATOR ===== */

.calc1-container{
  margin-top:60px;
  background: white;
  padding: 30px;
  box-shadow:0 15px 30px rgba(0,0,0,0.3);
  border-radius: 25px;
  width:max-content;
}

#display{
  width:100%;
  height:60px;
  border:none;
  outline:none;
  border-radius:12px;
  margin-bottom:20px;
  font-size:28px;
  text-align:right;
  padding-right:15px;
  background:#1f2730;
  color:white;
  box-shadow:inset 5px 5px 10px rgba(0,0,0,0.6),
  inset -5px -5px 10px rgba(255,255,255,0.05);
}

.calc1-buttons{
  display:grid;
  padding:20px;
  grid-template-columns:repeat(4,70px);
  gap:15px;
}

.calc1-buttons button{
  height:60px;
  border:none;
  border-radius:15px;
  font-size:18px;
  cursor:pointer;
  color:white;
  background:#293a49;
  box-shadow:6px 6px 12px rgba(0,0,0,0.6),
  -6px -6px 12px rgba(255,255,255,0.05);
}

.calc1-buttons button:active{
  box-shadow:inset 4px 4px 8px rgba(0,0,0,0.6),
  inset -4px -4px 8px rgba(255,255,255,0.05);
}

</style>
 </head> 
<body>
<div class="calc1-container">
  <input type="text" id="display" value="0" readonly>

  <div class="calc1-buttons">
    <button onclick="clearDisplay()">AC</button>
    <button onclick="deleteLast()">DL</button>
    <button onclick="append('%')">%</button>
    <button onclick="append('/')">/</button>

    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button onclick="append('*')">*</button>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button onclick="append('-')">-</button>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button onclick="append('+')">+</button>

    <button onclick="append('0')">0</button>
    <button onclick="append('00')">00</button>
    <button onclick="append('.')">.</button>
    <button onclick="calculateDisplay()">=</button>
  </div>
</div>
</body>
<script>
/* ===== STYLED CALCULATOR SCRIPT ===== */

let display = document.getElementById("display")

function append(value){
  if(display.value === "0"){
    display.value = value
  } else {
    display.value += value
  }
}

function clearDisplay(){
  display.value = "0"
}

function deleteLast(){
  display.value = display.value.slice(0,-1)
  if(display.value === ""){
    display.value = "0"
  }
}

function calculateDisplay(){
  try{
    display.value = eval(display.value)
  }
  catch{
    display.value = "Error"
  }
}
</script>
</body>
</html>
